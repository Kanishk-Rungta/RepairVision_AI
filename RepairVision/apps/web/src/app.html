<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The favicon <link> is emitted by the root layout (uses the cafe's
         custom favicon when set, else /favicon.svg) so there is exactly one. -->
    <!-- theme-color is emitted by the root layout too, because it follows the
         cafe's own colour rather than a fixed one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The site is a dark interface. Declared here as well as in app.css so
         scrollbars and form controls are dark before the stylesheet loads. -->
    <meta name="color-scheme" content="dark" />
    %sveltekit.head%
  </head>
  <body style="background:#040506" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
